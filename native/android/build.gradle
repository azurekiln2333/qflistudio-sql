group = 'com.azurekiln.qfli.sqlite_native'
version = '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.azurekiln.qfli.sqlite_native'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path '../runtime/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
